<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أكاديمية NEXVARY — فحص داخلي</title><link rel="stylesheet" href="/console.css"><script src="/console.js" defer></script></head>
