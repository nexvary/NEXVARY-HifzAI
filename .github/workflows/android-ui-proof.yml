name: Android UI Device Proof
on:
  push:
    branches: [dev/foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Hardware-accelerated Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
            mkdir -p ui-proof
            adb exec-out run-as com.nexvary.hifzai cat files/hifz-home.png > ui-proof/hifz-home.png
            adb exec-out run-as com.nexvary.hifzai cat files/hifz-reader.png > ui-proof/hifz-reader.png
            test -s ui-proof/hifz-home.png
            test -s ui-proof/hifz-reader.png
      - name: Upload genuine emulator screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HifzAI-0.5.0-dev-emulator-UI-proof
          path: ui-proof/*.png
          if-no-files-found: error
      - name: Keep XML instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HifzAI-instrumentation-report
          path: app/build/outputs/androidTest-results/
          if-no-files-found: ignore
