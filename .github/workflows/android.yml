name: Android CI
on:
  push:
    branches: [main, dev/foundation]
  pull_request:
  workflow_dispatch:
concurrency:
  group: hifz-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  corpus-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate corpus tooling
        run: python tools/run_python_tests.py
      - name: Preserve Python and academy test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HifzAI-python-academy-evidence
          path: build/python/test-results.json
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?${ANDROID_HOME} is required}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          printf 'y\n' | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests and assemble APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Enforce local-only permissions in built APK
        run: python tools/verify_local_only.py --apk app/build/outputs/apk/debug/app-debug.apk --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Preserve local-only APK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HifzAI-local-only-permissions
          path: build/local-only/permissions.json
          if-no-files-found: error
      - name: Verify production release guard is attached
        run: gradle :app:assembleRelease --dry-run --no-daemon | grep -F ':app:blockUnapprovedPublicRelease'
      - name: Calculate APK checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum *.apk > SHA256SUMS
      - name: Upload APK
        # Never distribute an unapproved APK from this public repository.
        if: success() && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-HifzAI-Android-0.5.0-dev-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
      - name: Preserve test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HifzAI-unit-and-lint-evidence
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
